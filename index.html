 S={...freshState(),...S};S.magic={...freshState().magic,...(S.magic||{})};S.skills={...freshSkills(),...(S.skills||{})};S.army={...freshState().army,...(S.army||{})};S.army.troops=S.army.troops||[];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=n=>Math.max(0,Math.min(100,n));const rand=a=>a[Math.floor(Math.random()*a.length)];
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(S))}
function log(text,icon='✦'){S.events.unshift({icon,text,time:`${['Spring','Summer','Autumn','Winter'][S.month%4]}, Year ${S.year}`});S.events=S.events.slice(0,8)}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2500)}
function adjust(key,amt){S[key]=key==='gold'?Math.max(0,S[key]+amt):clamp(S[key]+amt)}
function navTo(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${view}`));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navTo(b.dataset.view));
function modal(title,desc,options){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true"><button class="close-modal" aria-label="Close">×</button><h2>${title}</h2><p>${desc}</p><div class="choices">${options.map((o,i)=>`<button class="choice" data-choice="${i}"><span>${o.label}</span><small>${o.note||''}</small></button>`).join('')}</div></div></div>`;root.querySelector('.close-modal').onclick=()=>root.innerHTML='';root.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))root.innerHTML=''};root.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{root.innerHTML='';options[i].run()})}
function update(){save();$('#yearTop').textContent=`Year ${S.year}`;$('#goldTop').textContent=`${S.gold} crowns`;$('#avatarMini').textContent=S.affinity==='Vampire'?'🧛':S.affinity==='Werewolf'?'🐺':'🧑🏻‍🌾';renderLife();renderRealm();renderArcana();renderPeople();renderCharacter()}
function meter(label,value,icon,color=''){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}<span style="font:10px var(--sans);color:#929a8a"> / 100</span></div><div class="meter ${color}"><span style="width:${value}%"></span></div></div>`}
function eventHTML(){return S.events.length?S.events.slice(0,5).map(e=>`<div class="event"><div class="event-mark">${e.icon}</div><div class="event-text">${esc(e.text)}<time>${esc(e.time)}</time></div></div>`).join(''):'<p class="empty-note">Your chronicle begins here.</p>'}
function renderLife(){const heroLine=S.affinity==='Vampire'?'The night has claimed you. Your next chapter begins after dusk.':S.affinity==='Werewolf'?'The moon stirs beneath your skin. A wild path lies ahead.':`${S.title==='Commoner'?'A humble beginning, an unwritten fate.':`You are ${S.title.toLowerCase()}, and the realm knows your name.`}`;$('#view-life').innerHTML=`<div class="page-head"><div><div class="eyebrow">A living chronicle · ${S.month%4===0?'Spring':S.month%4===1?'Summer':S.month%4===2?'Autumn':'Winter'}</div><h1 class="page-title">Your life, ${esc(S.name.split(' ')[0])}</h1><p class="subtitle">Age ${S.age} · ${esc(S.title)} · ${esc(S.home)}</p></div><button class="year-button" onclick="advanceYear()">Live another year <span>→</span></button></div><div class="hero"><div class="hero-copy"><div class="hero-kicker">✦ &nbsp; A new chapter unfolds</div><h2>${S.affinity==='Mortal'?'The world is wider than you know.':'The old blood awakens.'}</h2><p>${heroLine} The choices you make will shape the person you become.</p><span class="origin-tag">✧ &nbsp; ${esc(S.trait)} <span style="color:#8f977f">·</span> ${esc(S.affinity)}</span></div><div class="hero-art"><div class="hero-symbol">${S.affinity==='Vampire'?'🌙':S.affinity==='Werewolf'?'🐺':'🌲'}</div></div></div><div class="stats">${meter('Health',S.health,'♡','red')}${meter('Happiness',S.happiness,'☼','gold')}${meter('Wisdom',S.wisdom,'✧')}${meter('Renown',S.renown,'♜','gold')}</div><div class="layout"><div><div class="section-row"><h2 class="section-title">Shape your days</h2><span style="font-size:10px;color:#8e9785">Choose a path</span></div><div class="panel"><div class="action-grid"><button class="action" onclick="studyAction()"><span class="action-icon">📖</span><b>Study & train</b><small>Grow your mind or master a craft</small></button><button class="action" onclick="workAction()"><span class="action-icon">⚒️</span><b>Earn a living</b><small>Find work and gather crowns</small></button><button class="action" onclick="socialAction()"><span class="action-icon">🍷</span><b>Spend an evening</b><small>Rest, celebrate, or make a friend</small></button><button class="action" onclick="exploreAction()"><span class="action-icon">🧭</span><b>Explore the wilds</b><small>Seek fortune beyond the village</small></button></div></div></div><div class="right-column"><div><div class="section-row"><h2 class="section-title">Recent moments</h2></div><div class="panel"><div class="event-list">${eventHTML()}</div></div></div><div><div class="section-row"><h2 class="section-title">Your standing</h2></div><div class="panel"><div class="event-list"><div class="event"><div class="event-mark">♜</div><div class="event-text">${esc(S.title)}<time>Rank in the realm</time></div></div><div class="event"><div class="event-mark">◈</div><div class="event-text">${S.gold} crowns<time>Personal fortune</time></div></div><div class="event"><div class="event-mark">⌂</div><div class="event-text">${S.land.length} holdings · ${S.business.length} ventures<time>Your legacy</time></div></div></div></div></div></div></div><div class="columns"><div class="panel"><div class="section-row"><h2 class="section-title">Those close to you</h2><button class="tiny-link" onclick="navTo('people')">See all →</button></div>${S.people.filter(p=>p.alive).slice(0,2).map(personHTML).join('')||'<p class="empty-note">You walk alone—for now.</p>'}</div><div class="panel"><div class="section-row"><h2 class="section-title">A note from the scribe</h2></div><p class="empty-note">There is no single road through the Northern Marches. Make a fortune, study the hidden arts, earn a title—or simply see what the next sunrise brings.</p></div></div>`}
function personHTML(p){return `<div class="person-row"><div class="person-face">${p.emoji}</div><div class="person-info"><b>${esc(p.name)}</b><small>${esc(p.role)}</small></div><span class="relation">♡ ${p.relation}</span></div>`}
function studyAction(){modal('What will you study?','A little knowledge can open unexpected doors.',[{label:'Read at the village scriptorium',note:'Wisdom +8 · 4 crowns',run:()=>{if(S.gold<4)return toast('You need 4 crowns for the scriptorium.');S.gold-=4;adjust('wisdom',8);adjust('happiness',2);log('You spent the afternoon among dusty books at the scriptorium.','📖');update()}},{label:'Train with the retired knight',note:'Health +5 · Renown +3',run:()=>{adjust('health',5);adjust('renown',3);log('Sir Aldric showed you the basics of sword and shield.','⚔️');update()}},{label:'Practice a little magic',note:'Wisdom +3 · discover Arcana',run:()=>{adjust('wisdom',3);S.flags.triedMagic=true;log('A candle flame bent toward your hand. Perhaps there is magic in you after all.','✧');update();toast('A spark answers your call…')}}])}
function workAction(){modal('Find honest work','The village always needs a pair of willing hands.',[{label:'Help at the Copper Kettle',note:'+12 crowns · Happiness +2',run:()=>{S.gold+=12;adjust('happiness',2);log('You served a busy evening at the Copper Kettle and earned a fair wage.','🍺');update()}},{label:'Harvest the Fen family fields',note:'+9 crowns · Health +3',run:()=>{S.gold+=9;adjust('health',3);log('The harvest was good. Mira slipped you an extra loaf for your hard work.','🌾');S.people[0].relation=clamp(S.people[0].relation+3);update()}},{label:'Carry a merchant’s sealed parcel',note:'+20 crowns · A little risky',run:()=>{S.gold+=20;let msg=Math.random()<.25?'The city watch questioned you about the parcel. Your reputation took a hit.':'The delivery went smoothly. The merchant paid generously.';if(msg.includes('watch'))adjust('reputation',-3);else adjust('reputation',1);log(msg,'📦');update()}}])}
function socialAction(){modal('How shall you spend the evening?','Small joys matter as much as grand ambitions.',[{label:'Share supper with Pip',note:'Happiness +8 · Friendship grows',run:()=>{adjust('happiness',8);S.people[2].relation=clamp(S.people[2].relation+10);log('You and Pip shared stories until the candles burned low.','🍲');update()}},{label:'Visit Mira at the apothecary',note:'Learn something useful',run:()=>{S.people[0].relation=clamp(S.people[0].relation+8);adjust('happiness',4);log('Mira showed you how to tell moonwort from common clover.','🌿');update()}},{label:'Take a quiet night in',note:'Health +9 · Happiness +3',run:()=>{adjust('health',9);adjust('happiness',3);log('You rested well, far from the noise of the tavern.','🌙');update()}}])}
function exploreAction(){modal('Where will curiosity lead?','The old paths hold things that never made it into the history books.',[{label:'Search the standing stones',note:'May reveal a magical gift',run:()=>{let r=Math.random();if(r<.34){S.flags.stones=true;S.magic.Green=Math.max(S.magic.Green,1);log('At the standing stones, green fire flickered in your palm. The land itself seemed to answer.','🌿');toast('Green magic awakened!')}else{S.gold+=6;log('You found a small purse beneath the stones—someone’s old offering.','◈')}update()}},{label:'Follow the river road',note:'A chance of treasure',run:()=>{if(Math.random()<.45){S.gold+=18;log('A broken cart by the river held a few forgotten crowns.','◈')}else{adjust('health',-5);log('A muddy fall on the river path left you sore but wiser.','🧭')}update()}},{label:'Ask about the moonlit cave',note:'A strange rumor',run:()=>{S.flags.caveRumor=true;log('A shepherd swears a pale stranger visits the cave when the moon is full.','🌙');update();navTo('arcana')}}])}
function advanceYear(){if(!S.alive)return toast('Your story has ended. Begin a new life from Character.');S.age++;S.year++;S.month=(S.month+1)%4;let msg;if(S.business.length){const income=S.business.reduce((a,b)=>a+b.income,0);S.gold+=income;msg=`Your ventures brought in ${income} crowns this year.`}else msg=rand(['A quiet year passes in the Northern Marches.','The seasons turn, and the village grows familiar.','Travelers brought strange tales from the southern kingdoms.','A hard winter tested everyone, but spring returned.']);const troopCount=S.army.troops.reduce((n,t)=>n+t.count,0),upkeep=troopCount*2;if(upkeep){const paid=Math.min(S.gold,upkeep);S.gold-=paid;if(paid<upkeep){S.army.morale=Math.max(0,S.army.morale-18);msg+=` Your treasury could only cover ${paid} of ${upkeep} crowns in army wages.`;if(S.army.morale<20&&Math.random()<.35){const deserters=Math.min(troopCount,Math.max(1,Math.ceil(troopCount*.1)));removeTroops(deserters);msg+=` ${deserters} soldiers deserted.`}}else msg+=` ${upkeep} crowns paid in army wages.`}if(S.age%5===0){adjust('health',-2);msg+=' The years are beginning to show.'}if(Math.random()<.18){let event=rand([{t:'A traveling storyteller filled the inn with songs of lost kings.',i:'🎻',h:3},{t:'A fever passed through the village. You recovered, though slowly.',i:'☘️',h:-7},{t:'You helped settle a dispute between neighbors. People trust you more.',i:'⚖️',r:4},{t:'A peddler sold you an odd charm that hums in moonlight.',i:'🌙',w:2}]);if(event.h)adjust('health',event.h);if(event.r)adjust('reputation',event.r);if(event.w){S.inventory.push('Moon-humming charm');S.flags.charm=true}msg+=' '+event.t}if(S.affinity==='Vampire'&&Math.random()<.2)adjust('health',-4);if(S.health<=0){S.alive=false;msg='Your long journey has come to an end. The Marches remember you.';S.ending=true}log(msg,'⌛');update();toast(S.alive?`Welcome to Year ${S.year}.`:'Your chronicle has ended.')}
function renderRealmLegacy(){const landOffers=[['Fenland acre','🌾','A fertile field along the Fenwater.','35 crowns',35,'Makes a fine home or farm.'],['Old watchtower','🗼','A weatherworn tower above the village road.','55 crowns',55,'A symbol of standing—and a little mystery.'],['Pinewood rights','🌲','A small stretch of timber-rich woodland.','48 crowns',48,'A useful holding for any rising house.']];const bizOffers=[['Wayfarer’s Inn','🍺','A warm inn at the crossroads.','60 crowns',60,8],['Apothecary stall','⚗️','Sell remedies and curious tinctures.','48 crowns',48,6],['Miller’s wheel','⚙️','Grind grain for every village in the valley.','72 crowns',72,11]];const rankCost=S.title==='Commoner'?30:50;$('#view-realm').innerHTML=`<div class="page-head"><div><div class="eyebrow">A place to call your own</div><h1 class="page-title">The Realm</h1><p class="subtitle">Build a legacy in the Northern Marches.</p></div></div><div class="stats" style="margin:0 0 20px">${meter('Holdings',S.land.length,'⌂')}${meter('Ventures',S.business.length,'⚒️')}${meter('Reputation',S.reputation,'♧','gold')}${meter('Rank',Math.min(100,S.renown+(S.title==='Commoner'?0:20)),'♜','gold')}</div><div class="section-row"><h2 class="section-title">Land & holdings</h2><span style="font-size:10px;color:#929b8a">${S.land.length} owned</span></div><div class="cards-grid">${landOffers.map((x,i)=>`<article class="world-card"><span class="wc-icon">${x[1]}</span><div class="card-kicker">LAND · ${x[3]}</div><h3>${x[0]}</h3><p>${x[2]}</p><button ${S.gold<x[4]||S.land.includes(x[0])?'disabled':''} onclick="buyLand(${i})">${S.land.includes(x[0])?'Already owned':`Purchase · ${x[4]} ◈`}</button></article>`).join('')}</div><div class="section-row" style="margin-top:24px"><h2 class="section-title">A livelihood of your own</h2><span style="font-size:10px;color:#929b8a">Income on each new year</span></div><div class="cards-grid">${bizOffers.map((x,i)=>`<article class="world-card"><span class="wc-icon">${x[1]}</span><div class="card-kicker">BUSINESS · ${x[3]}</div><h3>${x[0]}</h3><p>${x[2]}</p><button ${S.gold<x[4]||S.business.some(b=>b.name===x[0])?'disabled':''} onclick="buyBusiness(${i})">${S.business.some(b=>b.name===x[0])?'Already owned':`Open · ${x[4]} ◈`}</button></article>`).join('')}</div><div class="panel wide-panel"><div class="section-row"><h2 class="section-title">The noble court</h2><span class="relation">${esc(S.title)}</span></div><p class="notice">Nobility is earned through deeds, standing, and the favor of the court. Build a reputation and bring a worthy offering.</p><div class="event"><div class="event-mark">♜</div><div class="event-text"><b style="color:#e9dfc5">Petition for a title</b><time>${S.title==='Commoner'?'Requires 30 crowns and reputation 25, or two land holdings.':S.title==='Landed Gentry'?'Earn more renown and petition for a higher title.':'Your title is recognized throughout the Marches.'}</time></div><button class="primary" style="margin:0" onclick="petitionTitle()" ${S.title==='Noble'?'disabled':''}>${S.title==='Noble'?'Highest rank':'Petition · '+rankCost+' ◈'}</button></div></div>`}
const SKILL_META={Combat:['⚔️','Weapons, tactics, and command'],Scholarship:['📚','Lore, letters, and careful study'],Commerce:['◈','Trade, bargaining, and enterprise'],Stewardship:['🏰','Managing estates and resources'],Diplomacy:['🤝','Courtly speech and negotiation'],Survival:['🧭','Tracking, hunting, and wilderness craft'],Crafting:['🔨','Making useful tools and fine goods'],Social:['♡','Friendship, empathy, and influence'],Destruction:['🔥','Elemental force and direct magical attacks'],Conjuration:['🜂','Summoning allies and bound arms'],Alteration:['✧','Shaping matter, protection, and the body'],Restoration:['☼','Healing, wards, and renewal'],Necromancy:['☠️','Communing with the dead and raising servants'],Illusion:['🌫️','Glamour, misdirection, and the mind'],Spatial:['🌀','Distance, portals, and folded space'],Blood:['🩸','Vitality, sacrifice, and sanguine rites'], 'Dark Magic':['🌑','Curses, shadows, and forbidden power']};
function skillCost(name){return Math.min(1000000,12+(S.skills[name]||0)*6)}
function trainSkill(name){if(!SKILL_NAMES.includes(name))return;if(S.gold<skillCost(name))return toast(`You need ${skillCost(name)} crowns to study ${name}.`);let cost=skillCost(name);S.gold-=cost;S.skills[name]=(S.skills[name]||0)+1;if(['Destruction','Conjuration','Alteration','Restoration','Necromancy','Illusion','Spatial','Blood','Dark Magic'].includes(name))S.wisdom=clamp(S.wisdom+1);log(`You trained ${name} to rank ${S.skills[name]}.`,'✧');update();toast(`${name} · Rank ${S.skills[name]}`)}
function skillCard(name){let [icon,desc]=SKILL_META[name],rank=S.skills[name]||0,cost=skillCost(name);return `<article class="skill-card"><div class="skill-head"><span>${icon}</span><b>${name}</b><strong>Rank ${rank}</strong></div><p>${desc}</p><div class="meter"><span style="width:${Math.min(100,rank%10*10)}%;background:#a98dd4"></span></div><button class="primary" onclick="trainSkill('${name}')" ${S.gold<cost?'disabled':''}>Train · ${cost} ◈</button></article>`}
function updateAppearance(key,value){if(key==='name'){let n=value.trim();if(n)S.name=n.slice(0,35)}else if(['gender','bodyType','hairLength','hairstyle'].includes(key))S[key]=value;else if(key==='hairColor'||key==='eyeColor'){if(/^#[0-9a-f]{6}$/i.test(value))S[key]=value}if(key==='gender')S.pronoun=value==='Woman'?'she':value==='Man'?'he':'they';update()}
function renderCharacter(){renderCharacterLegacy();const appearance=`<div class="panel wide-panel"><div class="section-row"><h2 class="section-title">Shape your character</h2><span class="tiny-note">Changes save automatically</span></div><p class="notice">Choose the look and identity that feel right. These choices do not restrict your story or abilities.</p><div class="creator-grid"><label class="field">Name<input value="${esc(S.name)}" maxlength="35" onchange="updateAppearance('name',this.value)" autocomplete="off"></label><label class="field">Gender<select onchange="updateAppearance('gender',this.value)">${['Woman','Man','Nonbinary','Genderfluid','Other'].map(v=>`<option ${S.gender===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Body type<select onchange="updateAppearance('bodyType',this.value)">${['Petite','Lean','Average','Athletic','Broad','Soft'].map(v=>`<option ${S.bodyType===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Hair length<select onchange="updateAppearance('hairLength',this.value)">${['Shaved','Short','Shoulder-length','Long','Very long'].map(v=>`<option ${S.hairLength===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Hairstyle<select onchange="updateAppearance('hairstyle',this.value)">${['Loose waves','Straight','Braided','Curly','Tied back','Undercut','Cropped'].map(v=>`<option ${S.hairstyle===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field color-field">Hair color<input type="color" value="${S.hairColor}" onchange="updateAppearance('hairColor',this.value)"></label><label class="field color-field">Eye color<input type="color" value="${S.eyeColor}" onchange="updateAppearance('eyeColor',this.value)"></label></div><div class="appearance-summary"><span class="appearance-dot" style="--hair:${S.hairColor};--eyes:${S.eyeColor}">◉</span><span><b>${esc(S.gender)} · ${esc(S.bodyType)}</b><small>${esc(S.hairLength)} ${esc(S.hairstyle.toLowerCase())} · custom hair and eye colors</small></span></div></div><div class="panel wide-panel"><div class="section-row"><h2 class="section-title">Skill trees</h2><span class="tiny-note">No level cap · crowns fund training</span></div><p class="notice">Every rank strengthens your growing talents. Train any path whenever you can afford its lesson; costs rise gradually, with no maximum rank.</p><h3 class="tree-heading">Life & calling</h3><div class="skill-grid">${SKILL_NAMES.slice(0,8).map(skillCard).join('')}</div><h3 class="tree-heading">Arcane disciplines</h3><div class="skill-grid">${SKILL_NAMES.slice(8).map(skillCard).join('')}</div></div>`;$('#view-character').innerHTML+=appearance}
function renderArcana(){renderArcanaLegacy();$('#view-arcana').innerHTML+=`<div class="panel wide-panel"><div class="section-row"><h2 class="section-title">Nine arcane skill trees</h2><span class="tiny-note">Uncapped mastery</span></div><p class="notice">Train a discipline here or in Character → Skill trees. Spell ranks grow without a fixed ceiling.</p><div class="skill-grid">${SKILL_NAMES.slice(8).map(skillCard).join('')}</div></div>`}
function troopCount(){return S.army.troops.reduce((n,t)=>n+t.count,0)}
function removeTroops(amount){while(amount>0&&S.army.troops.length){let i=Math.floor(Math.random()*S.army.troops.length),t=S.army.troops[i],lost=Math.min(amount,t.count);t.count-=lost;amount-=lost;if(t.count<=0)S.army.troops.splice(i,1)}}
function renderRealm(){renderRealmLegacy();const n=troopCount(),types=[['Footmen','⚔️',5],['Archers','🏹',8],['Cavalry','🐎',14]];$('#view-realm').innerHTML+=`<div class="section-row" style="margin-top:24px"><h2 class="section-title">Your warband</h2><span class="tiny-note">Recruit, equip, and lead your own host</span></div><div class="panel army-panel"><div class="army-overview"><div><div class="army-number">${n}</div><small>soldiers under your banner</small></div><div class="army-stat"><b>Morale</b><span>${S.army.morale}%</span><div class="meter"><span style="width:${S.army.morale}%;background:#a7bd8e"></span></div></div><div class="army-stat"><b>Rations</b><span>${S.army.supplies}</span><small>provision units</small></div><div class="army-stat"><b>Victories</b><span>${S.army.victories}</span></div></div><h3 class="tree-heading">Recruit soldiers</h3><p class="notice">Recruit in groups of five. Each soldier costs the listed amount; upkeep is 2 crowns per soldier each year.</p><div class="recruit-grid">${types.map(([name,icon,cost])=>`<article class="recruit-card"><span>${icon}</span><b>${name}</b><small>5 recruits · ${cost*5} crowns</small><button class="primary" onclick="recruitTroops('${name}',5,${cost})" ${S.gold<cost*5?'disabled':''}>Recruit 5</button></article>`).join('')}</div><div class="army-roster"><b>Roster</b>${n?S.army.troops.map(t=>`<span>${esc(t.name)} <strong>× ${t.count}</strong></span>`).join(''):'<p class="empty-note">No soldiers yet. Recruit your first company to begin.</p>'}</div><div class="army-controls"><button class="primary" onclick="buyRations()" ${S.gold<10?'disabled':''}>Buy 20 rations · 10 ◈</button><button class="primary" onclick="drillArmy()" ${n===0?'disabled':''}>Drill the warband</button><button class="primary army-battle" onclick="leadBattle()" ${n===0||S.army.supplies<Math.ceil(n/5)?'disabled':''}>March against bandits</button></div><p class="tiny-note">Rations required to march: ${Math.ceil(n/5)} · You can grow your army as large as your treasury can sustain.</p></div>`}
function recruitTroops(name,count,cost){let total=count*cost;if(S.gold<total)return toast('You cannot afford those recruits.');S.gold-=total;let t=S.army.troops.find(x=>x.name===name);if(t)t.count+=count;else S.army.troops.push({name,count});S.army.morale=Math.min(100,S.army.morale+2);log(`You recruited ${count} ${name.toLowerCase()} to your banner.`,'⚔️');update();toast(`${count} ${name} recruited.`)}
function buyRations(){if(S.gold<10)return toast('You need 10 crowns for provisions.');S.gold-=10;S.army.supplies+=20;log('You stocked the army wagons with 20 units of provisions.','🌾');update();toast('Provisions secured.')}
function drillArmy(){let n=troopCount(),cost=10+Math.ceil(n/2);if(!n)return toast('Recruit soldiers before drilling.');if(S.gold<cost)return toast(`Drilling costs ${cost} crowns.`);S.gold-=cost;S.army.morale=Math.min(100,S.army.morale+15);S.skills.Combat++;log(`You drilled your ${n} soldiers; morale and discipline improved.`,'⚔️');update();toast(`Warband drilled · Combat rank ${S.skills.Combat}`)}
function leadBattle(){let n=troopCount(),rationCost=Math.ceil(n/5);if(!n)return toast('You need soldiers to march.');if(S.army.supplies<rationCost)return toast('Your army needs more rations before marching.');S.army.supplies-=rationCost;let strength=S.army.troops.reduce((v,t)=>v+t.count*(t.name==='Cavalry'?4:t.name==='Archers'?3:2),0)+S.skills.Combat*3+S.army.morale*.35,foe=20+Math.floor(Math.random()*Math.max(25,n*2)),won=strength>=foe||Math.random()<Math.min(.8,strength/(strength+foe));if(won){let casualties=Math.min(n,Math.floor(Math.random()*Math.max(1,n*.12))),loot=20+Math.floor(Math.random()*36);if(casualties)removeTroops(casualties);S.gold+=loot;S.army.morale=Math.min(100,S.army.morale+8);S.army.victories++;S.skills.Combat++;adjust('renown',5);log(`Your warband defeated the bandits, returning with ${loot} crowns${casualties?` after losing ${casualties} soldiers`:''}.`,'🏆');toast(`Victory! ${loot} crowns recovered.`)}else{let casualties=Math.min(n,Math.max(1,Math.ceil(n*(.15+Math.random()*.25))));removeTroops(casualties);S.army.morale=Math.max(0,S.army.morale-20);log(`The bandits scattered your force. ${casualties} soldiers were lost in the retreat.`,'⚔️');toast('Defeat. The survivors retreat to regroup.')};update()}
function buyLand(i){const offers=[['Fenland acre',35],['Old watchtower',55],['Pinewood rights',48]];let [name,cost]=offers[i];if(S.gold<cost)return toast('Not enough crowns.');if(S.land.includes(name))return toast('You already own this holding.');S.gold-=cost;S.land.push(name);adjust('renown',4);log(`You purchased ${name.toLowerCase()} and made it your own.`,'⌂');update();toast(`${name} is yours.`)}
function buyBusiness(i){const offers=[['Wayfarer’s Inn',60,8],['Apothecary stall',48,6],['Miller’s wheel',72,11]];let [name,cost,income]=offers[i];if(S.gold<cost)return toast('Not enough crowns.');if(S.business.some(b=>b.name===name))return toast('You already run this venture.');S.gold-=cost;S.business.push({name,income});adjust('reputation',3);log(`You opened the ${name}. It should bring in ${income} crowns each year.`,'⚒️');update();toast('Your new venture is open!')}
function petitionTitle(){if(S.title==='Noble')return toast('You already hold the highest title in the Marches.');let cost=S.title==='Commoner'?30:50;let qualified=S.title==='Commoner'?(S.reputation>=25||S.land.length>=2):S.renown>=35;if(!qualified)return toast(S.title==='Commoner'?'Earn 25 reputation or own two holdings to gain the court’s attention.':'Earn 35 renown before petitioning again.');if(S.gold<cost)return toast(`The court expects an offering of ${cost} crowns.`);S.gold-=cost;S.title=S.title==='Commoner'?'Landed Gentry':'Noble';adjust('renown',10);adjust('reputation',8);if(S.title==='Landed Gentry'&&!S.people.some(p=>p.name==='Lady Elowen'))S.people.push({name:'Lady Elowen',role:'Courtly patron',emoji:'👸🏻',relation:35,alive:true});log(`The court recognized you as ${S.title}. Your name now carries weight.`,'♜');update();toast(`You are now ${S.title}!`)}
function renderArcanaLegacy(){const schools=[['Ember','🔥','The cinder arts','Warmth, light, and fierce defensive magic.'],['Tide','🌊','The flowing arts','Healing, patience, and the turning of fortune.'],['Green','🌿','The old root','Speak with growing things; mend what is broken.'],['Veil','🌙','The hidden arts','Listen to echoes, glamour, and the quiet dark.']];$('#view-arcana').innerHTML=`<div class="page-head"><div><div class="eyebrow">What sleeps beneath the world</div><h1 class="page-title">Arcana</h1><p class="subtitle">Magic is a craft, a calling, and sometimes a dangerous bargain.</p></div></div><div class="panel"><div class="section-row"><h2 class="section-title">The four paths</h2><span style="font-size:10px;color:#929b8a">Wisdom ${S.wisdom}</span></div><p class="notice">Study a path to unlock its gifts. Each lesson costs 8 crowns and grows more expensive with mastery.</p>${schools.map(([key,icon,title,desc])=>{let level=S.magic[key],cost=8+level*10;return `<div class="magic-row"><div class="magic-symbol">${icon}</div><div class="magic-info"><b>${title}</b><p>${desc}</p><div class="meter" style="max-width:170px;margin-top:8px"><span style="width:${Math.min(100,level*25)}%;background:#a98dd4"></span></div></div><span class="magic-level">${level?`Rank ${level}`:'Untrained'}</span><button class="primary" style="margin:0" onclick="learnMagic('${key}')" ${level>=4||S.gold<cost?'disabled':''}>${level>=4?'Mastered':`Learn · ${cost} ◈`}</button></div>`}).join('')}</div><div class="section-row" style="margin-top:23px"><h2 class="section-title">Beyond mortal bounds</h2></div><div class="cards-grid"><article class="world-card"><span class="wc-icon">🐺</span><div class="card-kicker">THE WILD BLOOD</div><h3>Moonbound</h3><p>Accept an ancient pact and discover what lives beneath your skin.</p><button onclick="seekChange('Werewolf')" ${S.affinity!=='Mortal'?'disabled':''}>${S.affinity==='Werewolf'?'Your nature':S.affinity!=='Mortal'?'Unavailable':'Seek the old pact'}</button></article><article class="world-card"><span class="wc-icon">🧛</span><div class="card-kicker">THE PALE COURT</div><h3>Nightborn</h3><p>Find the hidden cave and bargain with a creature of the long night.</p><button onclick="seekChange('Vampire')" ${S.affinity!=='Mortal'?'disabled':''}>${S.affinity==='Vampire'?'Your nature':S.affinity!=='Mortal'?'Unavailable':'Seek the night'}</button></article><article class="world-card"><span class="wc-icon">📜</span><div class="card-kicker">YOUR DISCOVERIES</div><h3>Field notes</h3><p>${S.magicHistory.length?S.magicHistory.join(' · '):'Your magical discoveries will be recorded here.'}</p><button onclick="castMagic()" ${Object.values(S.magic).every(x=>x===0)?'disabled':''}>Practice a spell</button></article></div>`}
function learnMagic(key){let level=S.magic[key],cost=8+level*10;if(level>=4)return toast('You have mastered this path.');if(S.gold<cost)return toast('Not enough crowns for that lesson.');S.gold-=cost;S.magic[key]++;S.wisdom=clamp(S.wisdom+2);let spells={Ember:'a spark that dances between your fingers',Tide:'a bead of water that mended a cracked cup',Green:'a sprout that unfurled in your palm',Veil:'a whisper from a shadow that knew your name'};let note=`You learned ${key}: ${spells[key]}.`;S.magicHistory.unshift(note);log(note,'✧');update();toast(`${key} magic · Rank ${S.magic[key]}`)}
function castMagic(){let ready=Object.entries(S.magic).filter(([,n])=>n>0);if(!ready.length)return toast('Learn a magical path first.');modal('Practice a spell','A little practice sharpens your gift.',ready.map(([key,level])=>({label:`${key} · Rank ${level}`,note:key==='Tide'?'Restore health':key==='Ember'?'A flare of harmless light':key==='Green'?'Nurture a seedling':'A brief glamour',run:()=>{if(key==='Tide')adjust('health',8);if(key==='Ember')adjust('happiness',3);if(key==='Green')adjust('happiness',5);if(key==='Veil')adjust('wisdom',3);log(`You practiced ${key.toLowerCase()} magic. The spell came more easily this time.`,'✧');update();toast(`${key} magic practiced.`)}})))}
function seekChange(kind){if(S.affinity!=='Mortal')return;if(kind==='Werewolf'){if(!S.flags.stones)return modal('The old pact','The moonbound are said to gather at the standing stones. First, explore the wilds and seek their sign.',[{label:'I will look for the stones',note:'Return to your life',run:()=>navTo('life')}]);modal('A pact beneath the moon','The stones recognize you. The pact will change your life—there is no turning back.',[{label:'Accept the wild blood',note:'Become Moonbound',run:()=>{S.affinity='Werewolf';S.health=clamp(S.health+10);S.magic.Green=Math.max(1,S.magic.Green);log('Beneath the standing stones, you accepted the moonbound pact. The wild answered.','🐺');update();toast('You are Moonbound.')}}])}else{if(!S.flags.caveRumor)return modal('A rumor in the tavern','A shepherd told you of a cave where pale eyes watch the moon. Ask around or explore the river road to find a lead.',[{label:'Ask around the village',note:'Mark the rumor in your journal',run:()=>{S.flags.caveRumor=true;log('You heard a rumor about a pale stranger in a moonlit cave.','🌙');update();toast('Rumor added to your field notes.')}}]);modal('The pale stranger','A graceful figure offers immortality in exchange for a promise: keep the secret of the night. Do you accept?',[{label:'Drink from the crimson cup',note:'Become Nightborn · health +12',run:()=>{S.affinity='Vampire';S.health=clamp(S.health+12);S.magic.Veil=Math.max(1,S.magic.Veil);log('You accepted the pale stranger’s offer. Night opened its endless door.','🧛');update();toast('You are Nightborn.')}}])}}
function renderPeople(){$('#view-people').innerHTML=`<div class="page-head"><div><div class="eyebrow">Allies, rivals & chance encounters</div><h1 class="page-title">Your people</h1><p class="subtitle">Every relationship is a story in the making.</p></div></div><div class="panel"><div class="section-row"><h2 class="section-title">Known to you</h2><span style="font-size:10px;color:#929b8a">${S.people.filter(p=>p.alive).length} in your circle</span></div>${S.people.map((p,i)=>p.alive?`<div class="person-row"><div class="person-face">${p.emoji}</div><div class="person-info"><b>${esc(p.name)}</b><small>${esc(p.role)} · ${p.relation<20?'Acquaintance':p.relation<55?'Friend':'Close friend'}</small><div class="meter" style="max-width:180px;margin-top:7px"><span style="width:${p.relation}%;background:${p.relation<20?'#bc826f':'#a7bd8e'}"></span></div></div><span class="relation">♡ ${p.relation}</span><button class="primary" style="margin:0" onclick="talkTo(${i})">Talk</button></div>`:`<div class="person-row" style="opacity:.5"><div class="person-face">🕯️</div><div class="person-info"><b>${esc(p.name)}</b><small>No longer among the living</small></div></div>`).join('')||'<p class="empty-note">You have not met anyone yet. Try the village tavern.</p>'}</div><div class="panel wide-panel"><div class="section-row"><h2 class="section-title">Choices have consequences</h2></div><p class="notice">You can be kind, cruel, or somewhere in between. The Marches are small; word travels. Harm done to another person may haunt your conscience and your reputation.</p></div>`}
function talkTo(i){let p=S.people[i];if(!p||!p.alive)return toast('You cannot speak with them.');modal(`Speak with ${esc(p.name)}`,`${esc(p.role)} · Friendship ${p.relation}/100`,[{label:'Share a kind word',note:'Friendship +8 · Happiness +2',run:()=>{p.relation=clamp(p.relation+8);adjust('happiness',2);log(`You shared a warm conversation with ${p.name}.`,'♡');update()}},{label:'Ask for advice',note:'Wisdom +2 · Friendship +3',run:()=>{p.relation=clamp(p.relation+3);adjust('wisdom',2);log(`${p.name} shared a useful bit of advice with you.`,'💬');update()}},{label:'Offer a small gift',note:'Costs 8 crowns · Friendship +15',run:()=>{if(S.gold<8)return toast('You need 8 crowns for a thoughtful gift.');S.gold-=8;p.relation=clamp(p.relation+15);log(`You gave ${p.name} a thoughtful gift.`,'🎁');update()}},{label:'Start a quarrel',note:'Risky · may damage your standing',run:()=>{p.relation=clamp(p.relation-18);adjust('reputation',-2);log(`A heated argument with ${p.name} left hard feelings on both sides.`,'⚡');update()}},{label:'Challenge to a duel',note:'Dangerous · could injure either of you',run:()=>{let win=Math.random()<.45+(S.health/400);adjust('health',-8);if(win){adjust('renown',4);p.relation=clamp(p.relation-22);log(`You won a public duel with ${p.name}. The crowd cheered, but the friendship suffered.`,'⚔️')}else{adjust('health',-12);p.relation=clamp(p.relation-10);log(`You lost a duel with ${p.name} and left with bruises and a humbled pride.`,'⚔️')}update()}},{label:'Plot their death',note:'Dark choice · great risk, lasting consequences',run:()=>{modal('A terrible choice','The act would be deliberate and irreversible. If discovered, the law and the people may turn against you.',[{label:'Go through with it',note:'They will be gone; your conscience and standing suffer',run:()=>{p.alive=false;p.relation=0;adjust('happiness',-12);adjust('reputation',-18);adjust('renown',2);let caught=Math.random()<.42;if(caught){adjust('reputation',-20);log(`${p.name} was killed. Witnesses named you to the reeve; the Marches will not forget.`,'☠️');toast('The reeve has begun asking questions.')}else{log(`${p.name} was killed. No one can prove what happened, but the silence weighs on you.`,'☠️');toast('A choice you cannot undo.')};update()}},{label:'Step away',note:'No one is harmed',run:()=>toast('You chose not to cross that line.') }])}}])}
function renderCharacterLegacy(){$('#view-character').innerHTML=`<div class="page-head"><div><div class="eyebrow">The person behind the choices</div><h1 class="page-title">Character</h1><p class="subtitle">Your origins, gifts, and everything you have built.</p></div></div><div class="panel"><div class="profile-head"><div class="portrait">${S.affinity==='Vampire'?'🧛':S.affinity==='Werewolf'?'🐺':'🧑🏻‍🌾'}</div><div><h2>${esc(S.name)}</h2><p>Age ${S.age} · ${esc(S.title)} · ${esc(S.affinity)}</p></div></div><div class="detail-grid"><div class="detail"><span>Origin</span><b>${esc(S.trait)}</b></div><div class="detail"><span>Home</span><b>${esc(S.home)}</b></div><div class="detail"><span>Fortune</span><b>${S.gold} crowns</b></div><div class="detail"><span>Reputation</span><b>${S.reputation} / 100</b></div><div class="detail"><span>Land</span><b>${S.land.length} holdings</b></div><div class="detail"><span>Businesses</span><b>${S.business.length} ventures</b></div></div></div><div class="panel wide-panel"><div class="section-row"><h2 class="section-title">Your belongings</h2></div><p class="empty-note">${S.inventory.length?S.inventory.map(esc).join(' · '):'Just the clothes on your back—and whatever you make of this life.'}</p></div><div class="panel wide-panel"><div class="section-row"><h2 class="section-title">The chronicle</h2></div><div class="event-list">${S.events.map(e=>`<div class="event"><div class="event-mark">${e.icon}</div><div class="event-text">${esc(e.text)}<time>${esc(e.time)}</time></div></div>`).join('')}</div></div><div class="panel wide-panel"><div class="section-row"><h2 class="section-title">Your story, your way</h2></div><p class="notice">Rename your character or begin a completely new life. Starting over clears this device’s saved chronicle.</p><button class="primary" onclick="renameCharacter()">Choose a name</button> <button class="primary" onclick="newLife()">Begin a new life</button></div>`}
function renameCharacter(){let name=prompt('What name will the Marches know you by?',S.name);if(name&&name.trim()){S.name=name.trim().slice(0,35);log(`You chose the name ${S.name}.`,'✧');update();toast('Name updated.')}}
function newLife(){modal('Begin again?','This will erase your current chronicle from this device and create a fresh character.',[{label:'Start a new life',note:'Your current save will be replaced',run:()=>{S=freshState();update();navTo('life');toast('A new story begins.')}},{label:'Keep this life',note:'Return to your chronicle',run:()=>{}}])}
update();

</script>
</body></html>
